# NARSHA — Supabase DB 주간 자동 백업
#
# 저장 위치: 이 파일을 저장소의 .github/workflows/db-backup.yml 로 커밋한다.
#
# 하는 일
#   1. 매주 월요일 새벽 3시(KST)에 Supabase DB 전체를 덤프한다
#   2. 덤프 파일을 AES256으로 암호화한다 (저장소가 public이므로 필수)
#   3. 암호화된 파일을 워크플로 아티팩트로 올린다 (90일 보관)
#
# 사전 준비 — GitHub 저장소 Settings > Secrets and variables > Actions 에 등록
#   SUPABASE_DB_URL     : Supabase 대시보드 > Project Settings > Database > Connection string (URI)
#                         postgresql://postgres:[비밀번호]@db.xxxx.supabase.co:5432/postgres
#   BACKUP_PASSPHRASE   : 백업 파일을 여는 암호. 길고 무작위한 값으로 직접 정한다.
#                         이 값을 잃어버리면 백업을 영원히 못 연다. 비밀번호 관리자에 따로 보관할 것.
#
# 복구 방법 — 실제로 한 번 해보고 정리한 절차다 (2026-08-16 시연 완료).
# 아티팩트 zip 을 풀면 backup_<날짜>.tar.gz.gpg 하나가 나온다.
#
# 1) 복호화 · 압축 해제
#    암호를 명령줄에 직접 적으면 셸 히스토리에 남는다. 프롬프트로 받는다.
#
#    [Git Bash]
#      read -rsp "passphrase: " PW; echo
#      gpg --batch --yes --passphrase "$PW" -o backup.tar.gz -d backup_<날짜>.tar.gz.gpg
#      unset PW
#      tar -xzf backup.tar.gz          # → schema.sql, data.sql
#
#    [PowerShell] gpg 가 PATH 에 없으면 Git 설치본을 직접 지정한다
#      $gpg = "C:\Program Files\Git\usr\bin\gpg.exe"
#      $sec = Read-Host "passphrase" -AsSecureString
#      $PW = [Runtime.InteropServices.Marshal]::PtrToStringAuto(
#              [Runtime.InteropServices.Marshal]::SecureStringToBSTR($sec))
#      & $gpg --batch --yes --passphrase $PW -o backup.tar.gz -d backup_<날짜>.tar.gz.gpg
#      $PW = $null
#      tar -xzf backup.tar.gz
#
# 2) 복원 — psql 이 있으면
#      psql "<SUPABASE_DB_URL>" -f schema.sql
#      psql "<SUPABASE_DB_URL>" -f data.sql
#
#    psql 이 없으면 Supabase SQL Editor 에 붙여넣어도 된다 (덤프가 작다).
#    schema.sql 먼저, data.sql 나중. 순서를 바꾸면 테이블이 없어 실패한다.
#
#    ⚠️ Windows PowerShell 5.1 함정 — 클립보드로 옮길 때 반드시 -Encoding UTF8 을 준다.
#       Get-Content data.sql -Raw -Encoding UTF8 | Set-Clipboard
#       빼면 시스템 코드페이지(949)로 읽어 한글이 깨지고, 깨진 바이트가 따옴표를
#       망가뜨려 `syntax error at or near "{"` 로 실패한다. 실제로 겪었다.
#
# 3) 검증 — 행 수와 한글이 원본과 맞는지 본다
#      select count(*) from public.apps;                      -- 시드 앱 수
#      select learning_type from public.apps where id='memrise';  -- 한글이 안 깨졌는지
#
# 4) 뒤처리 — schema.sql · data.sql · backup.tar.gz 는 즉시 삭제한다.
#    덤프에는 auth.users 가 통째로 들어 있어 **회원 이메일이 평문**이다.
#    .gpg 파일만 남긴다.
#
# 주의 — 백업은 복구를 해봐야 백업이다. 처음 한 번은 반드시 복구를 시연해 볼 것.

name: DB Backup

on:
  schedule:
    # UTC 기준. 월요일 18:00 UTC = 화요일 03:00 KST
    - cron: '0 18 * * 1'
  # 필요할 때 수동 실행 (Actions 탭 > DB Backup > Run workflow)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Supabase CLI 설치
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 날짜 스탬프 생성
        id: stamp
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: DB 덤프
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL 시크릿이 설정되지 않았습니다."
            exit 1
          fi

          # 접속 주소만 먼저 확인한다 — 실패 원인의 대부분이 "어떤 주소로 붙었는지"에서
          # 갈린다. 비밀번호는 찍지 않고 host:port 만 남긴다 (host 는 공개 값인
          # VITE_SUPABASE_URL 에도 이미 드러나 있다).
          HOSTPORT=$(printf '%s' "$SUPABASE_DB_URL" | sed -E 's#^[^@]*@##; s#/.*$##')
          echo "접속 대상: $HOSTPORT"
          case "$HOSTPORT" in
            db.*.supabase.co*)
              # Supabase 직접 연결은 IPv6 전용이고 GitHub 러너는 IPv4 전용이라 붙지 않는다.
              echo "::error::직접 연결 주소($HOSTPORT)는 IPv6 전용이라 GitHub Actions 에서 붙지 않습니다. Supabase 대시보드 상단 Connect > Session pooler 의 URI(aws-…pooler.supabase.com:5432)로 SUPABASE_DB_URL 을 교체하세요."
              exit 1
              ;;
          esac
          # 스키마와 데이터를 각각 받는다. 스키마만 되돌리고 싶은 경우가 종종 있다.
          supabase db dump --db-url "$SUPABASE_DB_URL" -f schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only -f data.sql
          tar -czf "backup_${{ steps.stamp.outputs.date }}.tar.gz" schema.sql data.sql
          rm -f schema.sql data.sql

      - name: 암호화
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE 시크릿이 설정되지 않았습니다."
            exit 1
          fi
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$BACKUP_PASSPHRASE" \
              "backup_${{ steps.stamp.outputs.date }}.tar.gz"
          # 평문 원본은 즉시 삭제 — 아티팩트에 올라가면 안 된다
          rm -f "backup_${{ steps.stamp.outputs.date }}.tar.gz"

      - name: 결과 확인
        run: |
          ls -lh backup_*.tar.gz.gpg
          # 평문 파일이 남아 있으면 실패시킨다
          if ls backup_*.tar.gz 2>/dev/null | grep -qv '\.gpg$'; then
            echo "::error::암호화되지 않은 백업 파일이 남아 있습니다."
            exit 1
          fi

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ steps.stamp.outputs.date }}
          path: backup_*.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
